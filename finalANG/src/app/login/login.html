<section class="TITLE-page">
  <h1>Welcome Back</h1>
  <div class="section-description">
    Sign in to your account to access exclusive bookings and offers
  </div>
</section>

<div class="auth-form">
  <div *ngIf="message" [style.color]="messageColor" class="auth-message">{{ message }}</div>
  <form (ngSubmit)="login()">
    <div class="form-group">
      <label for="phone">Phone Number *</label>
      <input id="phone" name="phone" type="tel" [(ngModel)]="phone" required />
    </div>

    <div class="form-group">
      <label for="password">Password *</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" required />
    </div>

    <button type="submit">SIGN IN</button>
  </form>
  <p style="margin-top: 20px; font-size: 0.9rem">
    Don't have an account? <a routerLink="/register">Create one here</a>
  </p>
</div>
