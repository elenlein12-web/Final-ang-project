<section class="TITLE-page">
  <h1>Create Your Account</h1>
  <div class="section-description">
    Join us to enjoy exclusive member benefits and seamless bookings
  </div>
</section>

<div class="auth-form">
  <div *ngIf="message" [style.color]="messageColor" class="auth-message">{{ message }}</div>
  <form (ngSubmit)="register()">
    <div class="form-group">
      <label for="name">Full Name *</label>
      <input id="name" name="name" type="text" [(ngModel)]="fullName" required />
    </div>

    <div class="form-group">
      <label for="phone">Phone Number *</label>
      <input id="phone" name="phone" type="tel" [(ngModel)]="phone" required />
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" />
    </div>

    <div class="form-group">
      <label for="password">Password *</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" required />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password *</label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        [(ngModel)]="confirmPassword"
        required
      />
    </div>

    <button type="submit">CREATE ACCOUNT</button>
  </form>
  <p style="margin-top: 20px; font-size: 0.9rem">
    Already have an account? <a routerLink="/login">Sign in here</a>
  </p>
</div>
